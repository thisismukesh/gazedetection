[project]
name = "lookaway"
version = "0.1.0"
description = "Look Away: gaze-reactive art piece, laptop demo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "structlog>=24.1",
    "websockets>=12.0",
    "mediapipe>=0.10.14",
]

[project.scripts]
lookaway = "lookaway.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookaway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not manual'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
timeout_method = "thread"
markers = [
    "integration: full pipeline on clips, needs model file",
    "manual: needs live camera, GPU or display",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
